alo:
  spec_version: "0.1"
  id: scalar-and-derived
  version: "0.1.0"
  purpose: Exercise scalar decisions and derived values in a compact conformance case.
  threshold_version: "2026-01-01"

  inputs:
    amount:
      type: number
      required: true
    kind:
      type: enum
      values: [normal, urgent]
      required: false
      default: normal

  state_schema:
    status:
      type: enum
      values: [new, approved, review]
      initial: new
      updated_by: rule_engine
    score:
      type: number
      initial: 0
      updated_by: rule_engine

  derived_values:
    doubled_amount:
      type: number
      expression: input.amount * 2

  decisions:
    - id: risk_score
      type: scalar
      reads:
        - derived.doubled_amount
      question: What is the risk score for this amount?
      scale:
        min: 0
        max: 100

  transition_rules:
    - id: approve
      priority: 10
      when: decision.risk_score.score >= 70 and input.kind == 'normal'
      set:
        status: approved
        score: 100
      stop_condition: complete

    - id: review
      priority: 20
      when: no_previous_rule_matched
      set:
        status: review
        score: 0

  outputs:
    action:
      type: string

  stop_conditions:
    - complete
